<div class="header-content">
    <div class="identity">
        <span class="eyebrow">CURRICULUM VITAE</span>
        <h1>{{header.name}}</h1>
        <p>{{header.goalLife}}</p>
    </div>
    <div>
        <img class="profile-photo" [src]="header.photoURL" width="200" height="200" alt="Foto de {{header.name}}">
    </div>
    <div class="contact-list">
        <a [href]="'mailto:' + header.email">{{header.email}}</a>
        <span>{{header.phoneNumber}}</span>
        <span>{{header.location}}</span>
        <span>{{header.socialNetwork}}</span>
    </div>
</div>
