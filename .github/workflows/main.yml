name: Angular_DockerImage_v3

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  angular_deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v2

      - name: Use Node.js 16.x
        uses: actions/setup-node@v1
        with:
          node-version: 20.x

      - name: npm install
        run: npm ci

      - name: test
        run: |
          npm test -- --no-watch --no-progress --browsers=ChromeHeadlessCI

      - name: docker login
        env:
          DOCKER_USER: ${{secrets.DOCKER_USER}}
          DOCKER_PASSWORD: ${{secrets.DOCKER_PASSWORD}}
        run: |
          echo "$DOCKER_PASSWORD" | docker login --username "$DOCKER_USER" --password-stdin

      - name: Build the Docker image
        env:
          DOCKER_USER: ${{secrets.DOCKER_USER}}
        run: |
          docker build \
            --tag "$DOCKER_USER/mycv:${{ github.sha }}" \
            --tag "$DOCKER_USER/mycv:latest" \
            .

      - name: Docker Push
        env:
          DOCKER_USER: ${{secrets.DOCKER_USER}}
        run: |
          docker push "$DOCKER_USER/mycv:${{ github.sha }}"
          docker push "$DOCKER_USER/mycv:latest"
